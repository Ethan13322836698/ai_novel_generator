[package]
name = "novel-ai"
version = "0.1.0"
edition = "2021"
authors = ["Novel AI Tool"]
description = "AI全自动小说创作工具"

[[bin]]
name = "novel_ai"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", features = ["default"] }
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["blocking", "json"] }
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
